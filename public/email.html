<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 전송 - 런모아 라이브커머스 주문서 솔루션</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .email-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 700px;
            margin: 0 auto;
        }
        .header {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .form-group textarea {
            min-height: 100px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .file-preview {
            margin-bottom: 10px;
        }
        .file-preview a {
            color: #667eea;
            text-decoration: underline;
            cursor: pointer;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .radio-group label {
            margin-bottom: 0;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">📧 이메일 전송 페이지</div>
        <div id="alert" class="alert"></div>
        <form id="emailForm">
            <div class="form-group">
                <label for="templateSelect">이메일 템플릿 선택</label>
                <select id="templateSelect"></select>
            </div>
            <div class="form-group">
                <label for="recipient">받는 사람</label>
                <input type="email" id="recipient" name="recipient" required>
            </div>
            <div class="form-group">
                <label for="subject">제목</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="form-group file-preview">
                <label>첨부 파일</label>
                <span id="attachmentName"></span>
                <a id="previewLink" href="#" target="_blank" style="display:none;">[첨부 파일 미리보기]</a>
            </div>
            <div class="form-group">
                <label for="body">본문 내용</label>
                <textarea id="body" name="body" required></textarea>
            </div>
            <div class="form-group">
                <label>전송 옵션</label>
                <div class="radio-group">
                    <label><input type="radio" name="sendOption" value="now" checked> 지금 즉시 전송</label>
                    <label><input type="radio" name="sendOption" value="scheduled"> 예약 전송</label>
                    <input type="datetime-local" id="scheduledTime" style="display:none;">
                    <label><input type="radio" name="sendOption" value="auto"> 변환 완료시 자동 전송</label>
                </div>
            </div>
            <div class="button-group">
                <button type="button" class="btn btn-secondary" onclick="previewEmail()">미리보기</button>
                <button type="submit" class="btn btn-primary">전송 실행</button>
            </div>
        </form>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>이메일 전송 중...</p>
        </div>
    </div>
    <script>
        let userEmail = '';
        let userId = '';
        let fileName = '';
        let filePath = '';
        let today = '';

        window.onload = async function() {
            await checkSession();
            await loadTemplates();
            await loadAttachment();
        };

        async function checkSession() {
            try {
                const response = await fetch('/api/auth/session');
                const data = await response.json();
                if (!data.loggedIn) {
                    window.location.href = '/';
                    return;
                }
                userEmail = data.user.email;
                userId = data.user.user_id;
            } catch (error) {
                window.location.href = '/';
            }
        }

        async function loadTemplates() {
            try {
                const res = await fetch('/api/email/templates');
                let templates = await res.json();
                // 기본 템플릿 항상 추가
                if (!templates.includes('기본 템플릿')) templates.unshift('기본 템플릿');
                const select = document.getElementById('templateSelect');
                select.innerHTML = '';
                templates.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    select.appendChild(option);
                });
                select.onchange = loadTemplateDetail;
                select.value = '기본 템플릿';
                await loadTemplateDetail();
            } catch (error) {}
        }

        async function loadTemplateDetail() {
            const select = document.getElementById('templateSelect');
            const name = select.value;
            if (!name) return;
            if (name === '기본 템플릿') {
                // 기본 템플릿 자동 입력
                const now = new Date();
                const dateStr = now.toLocaleDateString('ko-KR') + ' ' + now.toLocaleTimeString('ko-KR');
                document.getElementById('recipient').value = userEmail;
                document.getElementById('subject').value = `[ 변환 결과 파일 전송 ] ${userId} ${dateStr}에 변환한 파일입니다.`;
                document.getElementById('body').value =
`안녕하세요. 런모아 파일 변환기입니다. 
요청하신 파일을 확인하신 매핑에 따라 변환하여 첨부하여 전달해 드립니다.
첨부 파일을 확인해 주시기 바랍니다.
감사합니다.`;
                return;
            }
            try {
                const res = await fetch(`/api/email/template/${encodeURIComponent(name)}`);
                const data = await res.json();
                document.getElementById('recipient').value = data.recipient || userEmail;
                document.getElementById('body').value = data.body || '';
                setDefaultSubject();
            } catch (error) {}
        }

        function setDefaultSubject() {
            today = new Date().toISOString().slice(0, 10);
            const sourceFileName = localStorage.getItem('sourceFileName') || '주문서';
            document.getElementById('subject').value = `[발주서] ${today} ${sourceFileName} 주문`;
        }

        async function loadAttachment() {
            // 서버에서 생성된 파일명/경로 받아오기 (localStorage)
            fileName = localStorage.getItem('generatedFileName') || '';
            filePath = localStorage.getItem('generatedFilePath') || '';
            document.getElementById('attachmentName').textContent = fileName;
            document.getElementById('previewLink').href = `/api/email/preview/${fileName}`;
            document.getElementById('previewLink').style.display = fileName ? 'inline' : 'none';
        }

        document.getElementById('emailForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            showLoading(true);
            const sendOption = document.querySelector('input[name="sendOption"]:checked').value;
            const scheduledTime = document.getElementById('scheduledTime').value;
            try {
                const res = await fetch('/api/email/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        templateName: document.getElementById('templateSelect').value,
                        recipient: document.getElementById('recipient').value,
                        subject: document.getElementById('subject').value,
                        body: document.getElementById('body').value,
                        attachmentPath: `uploads/${fileName}`,
                        sendOption,
                        scheduledTime
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert(data.message, 'success');
                    setTimeout(() => window.location.href = '/dashboard', 2000);
                } else {
                    showAlert(data.error, 'error');
                }
            } catch (error) {
                showAlert('이메일 전송 중 오류가 발생했습니다.', 'error');
            } finally {
                showLoading(false);
            }
        });

        function previewEmail() {
            alert(
                `제목: ${document.getElementById('subject').value}\n` +
                `받는 사람: ${document.getElementById('recipient').value}\n` +
                `첨부 파일: ${fileName}\n` +
                `본문 내용:\n${document.getElementById('body').value}`
            );
        }

        // 전송 옵션에 따라 예약 시간 입력 표시
        document.querySelectorAll('input[name="sendOption"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const scheduledInput = document.getElementById('scheduledTime');
                if (this.value === 'scheduled') {
                    scheduledInput.style.display = 'inline-block';
                } else {
                    scheduledInput.style.display = 'none';
                }
            });
        });

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => { alert.style.display = 'none'; }, 5000);
        }
        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) loading.style.display = 'block';
            else loading.style.display = 'none';
        }
    </script>
</body>
</html>
