<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>런모아 파일 변환 솔루션 - 회원가입</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        /* form-grid를 flex column으로 변경 */
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input.error {
            border-color: #dc3545;
        }

        .form-group input.success {
            border-color: #28a745;
        }

        .validation-message {
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .validation-message.error {
            color: #dc3545;
            display: block;
        }

        .validation-message.success {
            color: #28a745;
            display: block;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .id-check-section {
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            .form-grid {
                flex-direction: column;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            런모아 파일 변환 솔루션 - 회원가입
        </div>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-grid">
                <div class="form-group id-check-section">
                    <label for="userId" style="display:block; margin-bottom:12px;">회원 ID (ID 중복 체크)</label>
                    <div style="display: flex; gap: 10px; align-items: end;">
                        <input type="text" id="userId" name="userId" required style="flex:1;">
                        <button type="button" class="btn btn-secondary" onclick="checkUserId()">중복 체크</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required>
                    <div class="validation-message" id="passwordValidation">
                        비밀번호는 8자리 이상 영어 대문자, 소문자, 숫자와 특수문자를 포함해야 합니다.
                    </div>
                </div>
                <div class="form-group">
                    <label for="passwordConfirm">비밀번호(확인)</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" required>
                    <div class="validation-message" id="passwordConfirmValidation"></div>
                </div>
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">휴대폰 번호</label>
                    <input type="text" id="phone" name="phone" placeholder="010-0000-0000" required>
                    <div class="validation-message" id="phoneValidation"></div>
                </div>
                <div class="form-group">
                    <label for="email">사업장 이메일</label>
                    <input type="email" id="email" name="email" required>
                    <div class="validation-message" id="emailValidation"></div>
                </div>
                <div class="form-group">
                    <label for="businessName">사업장 상호명</label>
                    <input type="text" id="businessName" name="businessName" required>
                </div>
                <div class="form-group">
                    <label for="businessPhone">사업장 전화번호</label>
                    <input type="text" id="businessPhone" name="businessPhone" required>
                    <div class="validation-message" id="businessPhoneValidation"></div>
                </div>
                <div class="form-group">
                    <label for="businessAddress">사업장 주소</label>
                    <input type="text" id="businessAddress" name="businessAddress" required>
                </div>
            </div>
            <div class="button-group">
                <button type="button" class="btn btn-danger" onclick="resetForm()">초기화</button>
                <button type="submit" class="btn btn-primary">회원 가입</button>
                <button type="button" class="btn btn-secondary" onclick="goToLogin()">로그인 페이지</button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>회원가입 처리 중...</p>
        </div>
    </div>

    <script>
        let userIdChecked = false;

        // 실시간 유효성 검사
        document.getElementById('userId').addEventListener('input', function() {
            userIdChecked = false;
            // clearValidation('userId'); // 메시지 제거
        });

        document.getElementById('password').addEventListener('input', validatePassword);
        document.getElementById('passwordConfirm').addEventListener('input', validatePasswordConfirm);
        document.getElementById('phone').addEventListener('input', validatePhone);
        document.getElementById('email').addEventListener('input', validateEmail);
        document.getElementById('businessPhone').addEventListener('input', validateBusinessPhone);

        async function checkUserId() {
            const userId = document.getElementById('userId').value;
            
            if (!userId) {
                alert('회원 ID를 입력해주세요.');
                return;
            }

            try {
                const response = await fetch('/api/auth/check-id', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: userId })
                });

                const data = await response.json();
                
                if (data.available) {
                    userIdChecked = true;
                    alert(data.message);
                } else {
                    userIdChecked = false;
                    alert('이미 등록된 회원 ID입니다');
                }
            } catch (error) {
                console.error('ID 중복 체크 오류:', error);
                alert('ID 중복 체크 중 오류가 발생했습니다.');
            }
        }

        function validatePassword() {
            const password = document.getElementById('password').value;
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            
            if (password && !passwordRegex.test(password)) {
                showValidation('password', '비밀번호는 8자리 이상 영어 대문자, 소문자, 숫자와 특수문자를 포함해야 합니다.', 'error');
                return false;
            } else if (password) {
                showValidation('password', '사용 가능한 비밀번호입니다.', 'success');
                return true;
            } else {
                clearValidation('password');
                return false;
            }
        }

        function validatePasswordConfirm() {
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            
            if (passwordConfirm && password !== passwordConfirm) {
                showValidation('passwordConfirm', '비밀번호가 일치하지 않습니다.', 'error');
                return false;
            } else if (passwordConfirm && password === passwordConfirm) {
                showValidation('passwordConfirm', '비밀번호가 일치합니다.', 'success');
                return true;
            } else {
                clearValidation('passwordConfirm');
                return false;
            }
        }

        function validatePhone() {
            const phone = document.getElementById('phone').value;
            const phoneRegex = /^010-\d{4}-\d{4}$/;
            
            if (phone && !phoneRegex.test(phone)) {
                showValidation('phone', '올바르지 않은 휴대폰 번호 양식입니다.', 'error');
                return false;
            } else if (phone) {
                showValidation('phone', '올바른 휴대폰 번호입니다.', 'success');
                return true;
            } else {
                clearValidation('phone');
                return false;
            }
        }

        function validateEmail() {
            const email = document.getElementById('email').value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (email && !emailRegex.test(email)) {
                showValidation('email', '올바르지 않은 이메일 양식입니다.', 'error');
                return false;
            } else if (email) {
                showValidation('email', '올바른 이메일입니다.', 'success');
                return true;
            } else {
                clearValidation('email');
                return false;
            }
        }

        function validateBusinessPhone() {
            const businessPhone = document.getElementById('businessPhone').value;
            const businessPhoneRegex = /^0\d{1,2}-\d{3,4}-\d{4}$/;
            
            if (businessPhone && !businessPhoneRegex.test(businessPhone)) {
                showValidation('businessPhone', '올바르지 않은 사업장 전화번호 양식입니다.', 'error');
                return false;
            } else if (businessPhone) {
                showValidation('businessPhone', '올바른 사업장 전화번호입니다.', 'success');
                return true;
            } else {
                clearValidation('businessPhone');
                return false;
            }
        }

        function showValidation(fieldId, message, type) {
            const field = document.getElementById(fieldId);
            const validation = document.getElementById(fieldId + 'Validation');
            
            field.className = type === 'error' ? 'error' : 'success';
            validation.textContent = message;
            validation.className = `validation-message ${type}`;
        }

        function clearValidation(fieldId) {
            const field = document.getElementById(fieldId);
            const validation = document.getElementById(fieldId + 'Validation');
            
            field.className = '';
            validation.className = 'validation-message';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!userIdChecked) {
                showAlert('회원 ID 중복 체크를 완료해주세요.', 'error');
                return;
            }

            if (!validatePassword() || !validatePasswordConfirm() || !validatePhone() || !validateEmail() || !validateBusinessPhone()) {
                showAlert('입력 정보를 확인해주세요.', 'error');
                return;
            }

            const formData = {
                user_id: document.getElementById('userId').value,
                user_password: document.getElementById('password').value,
                password_confirm: document.getElementById('passwordConfirm').value,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                business_name: document.getElementById('businessName').value,
                business_phone: document.getElementById('businessPhone').value,
                business_address: document.getElementById('businessAddress').value
            };

            showLoading(true);
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                
                if (response.ok) {
                    showAlert('회원가입이 완료되었습니다.', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    showAlert(data.error || '회원가입에 실패했습니다.', 'error');
                }
            } catch (error) {
                console.error('회원가입 오류:', error);
                showAlert('회원가입 처리 중 오류가 발생했습니다.', 'error');
            } finally {
                showLoading(false);
            }
        });

        function resetForm() {
            document.getElementById('registerForm').reset();
            userIdChecked = false;
            
            // 모든 유효성 검사 메시지 초기화
            const validations = document.querySelectorAll('.validation-message');
            validations.forEach(validation => {
                validation.className = 'validation-message';
            });
            
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.className = '';
            });
        }

        function goToLogin() {
            window.location.href = '/';
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function showLoading(show) {
            const loading = document.getElementById('loading');
            const form = document.getElementById('registerForm');
            
            if (show) {
                loading.style.display = 'block';
                form.style.display = 'none';
            } else {
                loading.style.display = 'none';
                form.style.display = 'block';
            }
        }
    </script>
</body>
</html>
